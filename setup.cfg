[nosetests]
verbosity=2
attr=!manual
exclude=test_wildcard_performance
exe=1

[tool:pytest]
# importlib mode avoids inserting the repository root into sys.path, where the
# ``oscrypto`` git submodule directory would otherwise shadow the installed
# ``oscrypto`` package.
addopts = --import-mode=importlib -p no:cacheprovider
testpaths = dxlclient/test
